openapi: 3.1.0
info:
  title: ENOL SALESFORZE - Enterprise Field Force Automation & Territory
    Management API
  description: "

    ### Overview

    Backend REST API & Webhook Gateway for Automotive Lubricant Field Force
    Automation (FFA) in Pakistan.

    Features:

    - **5-Tier Organizational Hierarchy**: Director -> ZSM -> ASM -> Sales Rep
    -> Admin with materialized path queries

    - **Territory & Route Beat Management**: PostGIS multi-polygon district
    boundaries & daily rep beat schedules

    - **Retail & Workshop CRM**: Geocoded shop locations, credit limit hold
    enforcement & customer statement ledgers

    - **Mechanic Influencer Loyalty Network**: QR code scans & digital wallet
    payouts (JazzCash, Easypaisa)

    - **Lubricant SKU Catalog**: Carton units, pack sizes in liters, trade
    prices & automated commercial promotion schemes

    - **Order Booking & Idempotency**: Offline order booking with idempotency
    keys & automatic credit balance verification

    - **Shift & Attendance Tracking**: Shift punch-in/out with selfie
    verification & odometer image telemetry

    - **Field Visit Audit**: Real-time geofence distance calculation, mock GPS
    detection, and cash recovery slips

    - **GPS Breadcrumb Tracking**: Real-time location stream & route playback
    LineString generation

    - **TADA Claim Fraud Audit**: Automated odometer delta vs GPS distance
    comparison with variance % fraud flagging

    - **Sales Gamification & KPIs**: Real-time leaderboard rankings, target
    scorecards, and incentive races

    - **Offline Delta Sync**: High-efficiency delta synchronization for field
    mobile apps

    - **Bulk Data Exports**: High-throughput streaming CSV and JSON exports for
    enterprise data lakes

    - **Outbound Webhook Dispatcher**: Asynchronous event dispatch with
    HMAC-SHA256 signatures & auto-retry backoff

    \        "
  version: 1.0.0
  contact:
    name: ENOL Salesforze Architecture Team
    email: architecture@enollubricants.com
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token obtained from POST /api/v1/auth/login
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
      description: API Key for backend integrations, external OMS/ERP connectors, or
        automated pipelines
  schemas: {}
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      description: Authenticate user with email and password, returning JWT Bearer
        token and user profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      full_name:
                        type: string
                      phone:
                        type: string
                      role:
                        type: string
                      manager_id:
                        type: string
                        nullable: true
                      hierarchy_path:
                        type: string
                      vehicle_type:
                        type: string
                      vehicle_number:
                        type: string
                        nullable: true
                      fuel_rate_per_km:
                        type: number
                      daily_allowance:
                        type: number
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      description: Get profile details of currently authenticated user
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Default Response
  /api/v1/auth/api-keys:
    post:
      tags:
        - Authentication
      description: Generate a new API key for external OMS/ERP or backend integration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - key_name
              properties:
                key_name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expires_in_days:
                  type: integer
                  minimum: 1
        required: true
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      tags:
        - Authentication
      description: List API keys owned by currently authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Default Response
  /api/v1/users/:
    get:
      tags:
        - Users & Hierarchy
      description: Get paginated list of users with role, manager, and search filtering
      parameters:
        - schema:
            type: integer
            default: 1
          in: query
          name: page
          required: false
        - schema:
            type: integer
            default: 25
          in: query
          name: limit
          required: false
        - schema:
            type: string
            enum:
              - DIRECTOR
              - ZSM
              - ASM
              - SALES_REP
              - ADMIN
          in: query
          name: role
          required: false
        - schema:
            type: string
          in: query
          name: manager_id
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
        - schema:
            type: boolean
          in: query
          name: is_active
          required: false
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Default Response
    post:
      tags:
        - Users & Hierarchy
      description: Create a new user in the 5-tier sales force organization
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
                - phone
                - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                full_name:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum:
                    - DIRECTOR
                    - ZSM
                    - ASM
                    - SALES_REP
                    - ADMIN
                manager_id:
                  type: string
                  nullable: true
                bound_device_id:
                  type: string
                  nullable: true
                vehicle_type:
                  type: string
                  enum:
                    - MOTORCYCLE
                    - CAR
                    - VAN
                    - OTHER
                vehicle_number:
                  type: string
                  nullable: true
                fuel_rate_per_km:
                  type: number
                daily_allowance:
                  type: number
        required: true
      responses:
        "200":
          description: Default Response
  /api/v1/users/{id}:
    get:
      tags:
        - Users & Hierarchy
      description: Get user details by ID including manager info and direct
        subordinate count
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    put:
      tags:
        - Users & Hierarchy
      description: Update user profile, vehicle rates, or manager assignment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone:
                  type: string
                manager_id:
                  type: string
                  nullable: true
                bound_device_id:
                  type: string
                  nullable: true
                vehicle_type:
                  type: string
                  enum:
                    - MOTORCYCLE
                    - CAR
                    - VAN
                    - OTHER
                vehicle_number:
                  type: string
                  nullable: true
                fuel_rate_per_km:
                  type: number
                daily_allowance:
                  type: number
                is_active:
                  type: boolean
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    delete:
      tags:
        - Users & Hierarchy
      description: Deactivate user account (soft delete)
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/users/{id}/subordinates:
    get:
      tags:
        - Users & Hierarchy
      description: Get tree of all hierarchical subordinates down the materialized
        path for given user
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/territories/districts:
    get:
      tags:
        - Territories & Beats
      description: Get list of Pakistan territory districts with assigned ZSM/ASM and counts
      parameters:
        - schema:
            type: string
          in: query
          name: province
          required: false
        - schema:
            type: string
          in: query
          name: assigned_zsm_id
          required: false
        - schema:
            type: string
          in: query
          name: assigned_asm_id
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
      responses:
        "200":
          description: Default Response
    post:
      tags:
        - Territories & Beats
      description: Create a new territory district with boundary polygon GeoJSON
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - code
                - province
              properties:
                name:
                  type: string
                code:
                  type: string
                province:
                  type: string
                  enum:
                    - Punjab
                    - Sindh
                    - Khyber Pakhtunkhwa
                    - Balochistan
                    - Islamabad Capital Territory
                    - Gilgit-Baltistan
                    - Azad Jammu & Kashmir
                polygon_geojson:
                  type: object
                assigned_zsm_id:
                  type: string
                  nullable: true
                assigned_asm_id:
                  type: string
                  nullable: true
        required: true
      responses:
        "200":
          description: Default Response
  /api/v1/territories/districts/{id}:
    get:
      tags:
        - Territories & Beats
      description: Get territory district detail with polygon boundaries and active beats
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    put:
      tags:
        - Territories & Beats
      description: Update district boundaries, name, or assigned managers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                polygon_geojson:
                  type: object
                assigned_zsm_id:
                  type: string
                  nullable: true
                assigned_asm_id:
                  type: string
                  nullable: true
                is_active:
                  type: boolean
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/territories/beats:
    get:
      tags:
        - Territories & Beats
      description: Get list of territory beats filtered by district, day of week, or
        assigned rep
      parameters:
        - schema:
            type: string
          in: query
          name: district_id
          required: false
        - schema:
            type: string
            enum:
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
          in: query
          name: day_of_week
          required: false
        - schema:
            type: string
          in: query
          name: assigned_rep_id
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
      responses:
        "200":
          description: Default Response
    post:
      tags:
        - Territories & Beats
      description: Create a new beat route for field sales force
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - district_id
                - name
                - code
                - day_of_week
              properties:
                district_id:
                  type: string
                name:
                  type: string
                code:
                  type: string
                day_of_week:
                  type: string
                  enum:
                    - MONDAY
                    - TUESDAY
                    - WEDNESDAY
                    - THURSDAY
                    - FRIDAY
                    - SATURDAY
                    - SUNDAY
                assigned_rep_id:
                  type: string
                  nullable: true
        required: true
      responses:
        "200":
          description: Default Response
  /api/v1/territories/beats/{id}:
    get:
      tags:
        - Territories & Beats
      description: Get beat details and list of all clients on this beat route
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    put:
      tags:
        - Territories & Beats
      description: Update beat details or rep assignment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                day_of_week:
                  type: string
                  enum:
                    - MONDAY
                    - TUESDAY
                    - WEDNESDAY
                    - THURSDAY
                    - FRIDAY
                    - SATURDAY
                    - SUNDAY
                assigned_rep_id:
                  type: string
                  nullable: true
                is_active:
                  type: boolean
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/clients/:
    get:
      tags:
        - Clients & Ledger
      description: Get paginated list of retail and distributor clients with credit
        and location details
      parameters:
        - schema:
            type: string
          in: query
          name: beat_id
          required: false
        - schema:
            type: string
          in: query
          name: district_id
          required: false
        - schema:
            type: boolean
          in: query
          name: credit_hold
          required: false
        - schema:
            type: string
            enum:
              - PENDING
              - APPROVED
              - REJECTED
              - SUSPENDED
          in: query
          name: approval_status
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
      responses:
        "200":
          description: Default Response
    post:
      tags:
        - Clients & Ledger
      description: Register a new retail or workshop client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - district_id
                - business_name
                - owner_name
                - phone
                - address
                - latitude
                - longitude
              properties:
                district_id:
                  type: string
                beat_id:
                  type: string
                  nullable: true
                business_name:
                  type: string
                owner_name:
                  type: string
                phone:
                  type: string
                cnic:
                  type: string
                  nullable: true
                address:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                credit_limit:
                  type: number
                  default: 100000
        required: true
      responses:
        "200":
          description: Default Response
  /api/v1/clients/{id}:
    get:
      tags:
        - Clients & Ledger
      description: Get client profile, coordinates, credit limits, and recent ledger entries
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    put:
      tags:
        - Clients & Ledger
      description: Update client details, coordinates, or credit terms
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                beat_id:
                  type: string
                  nullable: true
                business_name:
                  type: string
                owner_name:
                  type: string
                phone:
                  type: string
                cnic:
                  type: string
                  nullable: true
                address:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                credit_limit:
                  type: number
                credit_hold:
                  type: boolean
                approval_status:
                  type: string
                  enum:
                    - PENDING
                    - APPROVED
                    - REJECTED
                    - SUSPENDED
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/clients/{id}/ledger:
    get:
      tags:
        - Clients & Ledger
      description: Get complete statement of account ledger entries for a client
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    post:
      tags:
        - Clients & Ledger
      description: Post a payment, invoice, or credit adjustment to client ledger and
        update outstanding balance
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - entry_type
                - amount
              properties:
                entry_type:
                  type: string
                  enum:
                    - INVOICE
                    - PAYMENT
                    - CREDIT_NOTE
                    - DEBIT_NOTE
                    - ADJUSTMENT
                amount:
                  type: number
                  minimum: 0.01
                reference_type:
                  type: string
                  enum:
                    - ORDER
                    - RECOVERY_SLIP
                    - BANK_TRANSFER
                    - CHEQUE
                    - MANUAL
                  default: MANUAL
                reference_id:
                  type: string
                description:
                  type: string
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/mechanics/:
    get:
      tags:
        - Mechanics & Loyalty
      description: Get paginated list of mechanics in the loyalty influencer program
      parameters:
        - schema:
            type: string
            enum:
              - 4-STROKE_MOTORCYCLE
              - HEAVY_DIESEL
              - PASSENGER_CAR
              - TRACTOR_AGRI
              - GENERAL_AUTO
          in: query
          name: specialty
          required: false
        - schema:
            type: string
            enum:
              - EASYPAISA
              - JAZZCASH
              - NAYAPAY
              - SADAPAY
              - BANK_ACCOUNT
          in: query
          name: wallet_provider
          required: false
        - schema:
            type: string
          in: query
          name: client_id
          required: false
        - schema:
            type: string
          in: query
          name: qr_code_id
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
      responses:
        "200":
          description: Default Response
    post:
      tags:
        - Mechanics & Loyalty
      description: Register a new mechanic in the loyalty network
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
                - specialty
                - wallet_provider
                - wallet_account_number
              properties:
                client_id:
                  type: string
                  nullable: true
                name:
                  type: string
                phone:
                  type: string
                cnic:
                  type: string
                  nullable: true
                specialty:
                  type: string
                  enum:
                    - 4-STROKE_MOTORCYCLE
                    - HEAVY_DIESEL
                    - PASSENGER_CAR
                    - TRACTOR_AGRI
                    - GENERAL_AUTO
                wallet_provider:
                  type: string
                  enum:
                    - EASYPAISA
                    - JAZZCASH
                    - NAYAPAY
                    - SADAPAY
                    - BANK_ACCOUNT
                wallet_account_number:
                  type: string
                qr_code_id:
                  type: string
        required: true
      responses:
        "200":
          description: Default Response
  /api/v1/mechanics/{id}:
    get:
      tags:
        - Mechanics & Loyalty
      description: Get mechanic details, wallet numbers, loyalty points, and workshop link
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    put:
      tags:
        - Mechanics & Loyalty
      description: Update mechanic profile or payout wallet account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  nullable: true
                name:
                  type: string
                specialty:
                  type: string
                  enum:
                    - 4-STROKE_MOTORCYCLE
                    - HEAVY_DIESEL
                    - PASSENGER_CAR
                    - TRACTOR_AGRI
                    - GENERAL_AUTO
                wallet_provider:
                  type: string
                  enum:
                    - EASYPAISA
                    - JAZZCASH
                    - NAYAPAY
                    - SADAPAY
                    - BANK_ACCOUNT
                wallet_account_number:
                  type: string
                is_verified:
                  type: boolean
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/mechanics/{id}/points:
    post:
      tags:
        - Mechanics & Loyalty
      description: Award loyalty points for cap coupon QR scan or promotion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  type: integer
                  minimum: 1
                reason:
                  type: string
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/v1/products/:
    get:
      tags:
        - Product Catalog
      description: Get paginated catalog of automotive lubricants, pack sizes, carton
        units, and schemes
      parameters:
        - schema:
            type: string
            enum:
              - PASSENGER_CAR_MOTOR_OIL
              - HEAVY_DUTY_DIESEL
              - MOTORCYCLE_4T
              - GEAR_OIL
              - TRANSMISSION_FLUID
              - COOLANT
              - GREASE
              - SPECIALTY
          in: query
          name: category
          required: false
        - schema:
            type: string
          in: query
          name: viscosity_grade
          required: false
        - schema:
            type: boolean
          in: query
          name: is_active
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
      responses:
        "200":
          description: Default Response
    post:
      tags:
        - Product Catalog
      description: Add a new automotive lubricant SKU to the catalog
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - sku
                - name
                - category
                - viscosity_grade
                - pack_size_liters
                - trade_price
                - retail_price
              properties:
                sku:
                  type: string
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
                  enum:
                    - PASSENGER_CAR_MOTOR_OIL
                    - HEAVY_DUTY_DIESEL
                    - MOTORCYCLE_4T
                    - GEAR_OIL
                    - TRANSMISSION_FLUID
                    - COOLANT
                    - GREASE
                    - SPECIALTY
                viscosity_grade:
                  type: string
                pack_size_liters:
                  type: number
                units_per_carton:
                  type: integer
                  default: 1
                trade_price:
                  type: number
                retail_price:
                  type: number
                active_schemes:
                  type: array
                  items:
                    type: object
                stock_quantity:
                  type: integer
                  default: 1000
        required: true
      responses:
        "200":
          description: Default Response
  /api/v1/products/{id}:
    get:
      tags:
        - Product Catalog
      description: Get product SKU detail with pricing, carton packing, and active
        trade schemes
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    put:
      tags:
        - Product Catalog
      description: Update lubricant prices, schemes, or inventory details
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                trade_price:
                  type: number
                retail_price:
                  type: number
                active_schemes:
                  type: array
                  items:
                    type: object
                stock_quantity:
                  type: integer
                is_active:
                  type: boolean
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    delete:
      tags:
        - Product Catalog
      description: Deactivate a product SKU
      parameters:
        - schema:
            type: string
          in: path
          name: id
