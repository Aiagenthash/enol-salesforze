    get:
      tags:
        - Outbound Webhooks Gateway
      description: Get paginated audit logs of webhook delivery attempts, HTTP
        responses, and error traces
      parameters:
        - schema:
            type: string
          in: query
          name: subscription_id
          required: false
        - schema:
            type: string
          in: query
          name: event_name
          required: false
        - schema:
            type: boolean
          in: query
          name: failed_only
          required: false
      responses:
        "200":
          description: Default Response
  /api/v1/webhooks/test-dispatch:
    post:
      tags:
        - Outbound Webhooks Gateway
      description: Trigger a simulated webhook event for external developers to verify
        HMAC-SHA256 signature verification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - event_name
              properties:
                event_name:
                  type: string
                  enum:
                    - order.created
                    - order.approved
                    - order.delivered
                    - visit.completed
                    - client.created
                    - tada.submitted
                sample_payload:
                  type: object
        required: true
      responses:
        "200":
          description: Default Response
